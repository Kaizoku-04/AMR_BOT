# controller_manager provides the necessary infrastructure to manage multiple controllers
# efficiently and robustly using ROS 2 Control.
controller_manager:
 ros__parameters:
   update_rate: 50  # Hz

   # Declare the controllers
   joint_state_broadcaster:
     type: joint_state_broadcaster/JointStateBroadcaster

   diff_drive_controller:
     type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_wheel_joint"]
    right_wheel_names: ["right_wheel_joint"]

    wheel_separation: 0.40
    wheel_radius: 0.1
    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0
    
    # TF configuration
    tf_frame_prefix_enable: false
    tf_frame_prefix: ""
    odom_frame_id: odom
    base_frame_id: base_footprint

    # Odometry parameters
    # Non-zero so the EKF weighs wheel odometry against the IMU (x, y, z, roll, pitch, yaw);
    # 1e6 = "not measured" for the planar-robot axes
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.01]
    position_feedback: true
    open_loop: false
    enable_odom_tf: true  # overwritten per launch (enable_odom_tf arg); false when the EKF owns odom->base TF

    # Command handling
    cmd_vel_timeout: 0.5
    publish_limited_velocity: false
    velocity_rolling_window_size: 10
    publish_rate: 50.0

    # Velocity / acceleration limits (match Nav2: 0.5 m/s, 2.5 rad/s). min_* must be <= 0.
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.has_jerk_limits: false
    linear.x.max_velocity: 0.5
    linear.x.min_velocity: -0.5
    linear.x.max_acceleration: 1.0
    linear.x.min_acceleration: -1.0
    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.has_jerk_limits: false
    angular.z.max_velocity: 2.5
    angular.z.min_velocity: -2.5
    angular.z.max_acceleration: 3.2
    angular.z.min_acceleration: -3.2
