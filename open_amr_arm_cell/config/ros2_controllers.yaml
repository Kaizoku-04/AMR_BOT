# ros2_control for one cell (namespaced by the launch file: /<arm_id>/controller_manager). Sim: the topic hardware
# interface bridged to the Isaac articulation; real: ur_robot_driver brings its own controllers (the cell controller
# only needs a FollowJointTrajectory action: scaled_joint_trajectory_controller there).
/**/controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**/joint_trajectory_controller:
  ros__parameters:
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
    command_interfaces: [position, velocity, acceleration]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # goal tolerances loose enough for the sim's velocity jitter (0.001 rad / 0.01 rad/s never completed); precision
    # comes from the cell executor, which waits until the measured joints are within 0.001 rad of a move's end before
    # planning the next (a plan from a stale state made the controller snap the arm onto the planned start: cartons
    # landed up to 14 mm off — gripper test, 2026-09-26)
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 0.5
      shoulder_pan_joint: {trajectory: 0.05, goal: 0.005}
      shoulder_lift_joint: {trajectory: 0.05, goal: 0.005}
      elbow_joint: {trajectory: 0.05, goal: 0.005}
      wrist_1_joint: {trajectory: 0.05, goal: 0.005}
      wrist_2_joint: {trajectory: 0.05, goal: 0.005}
      wrist_3_joint: {trajectory: 0.05, goal: 0.005}
