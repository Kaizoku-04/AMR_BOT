# IK for the cell's planning group (base_link -> tcp). KDL as in ur_moveit_config; a longer timeout because the
# cell controller seeds every IK call with the previous waypoint (deterministic, taught-pattern style).
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.05
ur_manipulator:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.005
